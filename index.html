<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>ЕГЭ — догонялка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3E%D0%95%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d12; --card:#151a23; --card2:#1b2130; --line:#242c3b;
    --txt:#e9edf5; --mut:#8b95a8; --math:#7c5cff; --inf:#2ecc71; --warn:#ffb340; --ok:#37d67a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt)}
  body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding-bottom:calc(78px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}
  h1{font-size:21px;line-height:1.2;margin:0 0 2px;letter-spacing:-.3px}
  h2{font-size:15px;margin:22px 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .sub{color:var(--mut);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card.tight{padding:12px 14px}
  .row{display:flex;align-items:center;gap:10px}
  .row.between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .name{font-weight:650;font-size:15px}
  .goal{font-size:26px;font-weight:750;letter-spacing:-.5px}
  .muted{color:var(--mut)}
  .small{font-size:12.5px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;color:#cfd7e6}
  .chip b{color:#fff;font-weight:650}
  .bar{height:8px;border-radius:999px;background:#232a38;overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;border-radius:999px;transition:width .25s ease}
  .big{background:linear-gradient(160deg,#1a2130,#131824);border:1px solid #2a3346}
  .bignum{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.05}
  .accent{color:#fff}
  .pill{display:inline-block;background:#20283a;border-radius:999px;padding:2px 8px;font-size:11.5px;color:#aab6cc}
  .lesson{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid #1d2432}
  .lesson:last-child{border-bottom:none}
  .cb{width:24px;height:24px;border-radius:8px;border:1.5px solid #3a4459;flex:none;margin-top:1px;
      display:grid;place-items:center;font-size:14px;color:transparent;background:#141a25}
  .cb.on{background:var(--ok);border-color:var(--ok);color:#06210f}
  .lt{font-weight:600;font-size:14.5px}
  .lt.done{color:#6d788d;text-decoration:line-through;text-decoration-thickness:1px}
  .ld{font-size:12px;color:var(--mut);margin-top:2px}
  .tasks{font-size:11.5px;color:#9fb0c9;background:#1c2433;border-radius:8px;padding:2px 7px;white-space:nowrap}
  .future{opacity:.55}
  .tag{font-size:11px;padding:2px 7px;border-radius:7px;background:#2a2333;color:#d3b8ff}
  .btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:650;width:100%;
       background:#2a3346;color:#e9edf5;cursor:pointer;transition:filter .15s}
  .btn:active{filter:brightness(1.15)}
  .btn.primary{background:linear-gradient(135deg,#6f4bff,#8f6bff)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:#cfd7e6}
  .btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:11px}
  .field{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1d2432}
  .field:last-child{border-bottom:none}
  .field label{flex:1;font-size:14px}
  input,select{font:inherit;color:var(--txt);background:#10151f;border:1px solid var(--line);
       border-radius:11px;padding:9px 11px;width:110px;text-align:center}
  input[type=password],input[type=text].wide{width:100%;text-align:left}
  input[type=time]{width:120px}
  input[type=checkbox]{width:auto}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,13,18,.92);
        backdrop-filter:blur(14px);border-top:1px solid var(--line);
        padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  .tabs .in{max-width:560px;margin:0 auto;display:flex;gap:6px}
  .tab{flex:1;text-align:center;padding:8px 6px;border-radius:12px;color:var(--mut);font-size:12px;
       background:none;border:0;font-family:inherit;cursor:pointer}
  .tab .ic{display:block;font-size:19px;line-height:1.1;margin-bottom:3px}
  .tab.on{color:#fff;background:#1b2231}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
         background:#243049;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;
         opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  .empty{text-align:center;padding:26px 10px;color:var(--mut)}
  .empty .e{font-size:34px;display:block;margin-bottom:8px}
  .seg{display:flex;gap:8px;margin:0 0 14px}
  .seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#131926;
       color:var(--mut);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .seg button.on{background:#222b3d;color:#fff;border-color:#36415a}
  .hint{font-size:12.5px;color:#8b95a8;line-height:1.5}
  .ok{color:var(--ok)} .warn{color:var(--warn)}
  .ico{font-size:17px}
  .lnk{background:none;border:0;padding:0;color:#9d86ff;font:inherit;cursor:pointer}
  details{border-top:1px solid #1d2432;padding-top:10px;margin-top:10px}
  summary{cursor:pointer;color:#a9b4c8;font-size:13.5px}
  a{color:#9d86ff}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<nav class="tabs">
  <div class="in">
    <button class="tab" data-act="tab" data-tab="today"><span class="ic">◎</span>Сегодня</button>
    <button class="tab" data-act="tab" data-tab="plan"><span class="ic">☰</span>План</button>
    <button class="tab" data-act="tab" data-tab="set"><span class="ic">⚙</span>Настройки</button>
  </div>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ================= данные ================= */
const DATA_DEFAULT = {"math":[{"N":1,"T":"Основы Тригонометрии №8","D":"2026-09-14T16:00","K":16},{"N":2,"T":"Простейшая Планиметрия №1","D":"2026-09-16T18:00","K":60},{"N":3,"T":"Тригонометрия №8","D":"2026-09-18T16:00","K":30},{"N":4,"T":"Простейшие уравнения и действия со степенями №7 и №8","D":"2026-09-21T16:00","K":21},{"N":5,"T":"Простейшая Планиметрия №1","D":"2026-09-23T18:00","K":67},{"N":6,"T":"Логарифмы, действия + уравнения №7 и №8","D":"2026-09-25T16:00","K":35},{"N":7,"T":"Теория вероятностей №4","D":"2026-09-28T16:00","K":21},{"N":8,"T":"Простая планиметрия №18","D":"2026-09-29T18:00","K":5},{"N":9,"T":"Сложая планиметрия №18","D":"2026-09-30T18:00","K":3},{"N":10,"T":"Вебинар с Методистом","D":"2026-10-01T18:00","K":1},{"N":11,"T":"Теория вероятностей №5","D":"2026-10-02T16:00","K":17},{"N":12,"T":"Мат статистика №6","D":"2026-10-05T16:00","K":12},{"N":13,"T":"Простая планиметрия №18","D":"2026-10-06T18:00","K":6},{"N":14,"T":"Сложая планиметрия №18","D":"2026-10-07T18:00","K":3},{"N":15,"T":"Вебинар с Методистом","D":"2026-10-08T18:00","K":1},{"N":16,"T":"Векторы №2","D":"2026-10-09T16:00","K":17},{"N":17,"T":"Производная №9","D":"2026-10-12T16:00","K":75},{"N":18,"T":"Простая планиметрия №18","D":"2026-10-13T18:00","K":5},{"N":19,"T":"Сложная планиметрия №18","D":"2026-10-14T18:00","K":3},{"N":20,"T":"Вебинар с Методистом Повторение Планиметрии","D":"2026-10-15T18:00","K":1},{"N":21,"T":"Повторение теорвера и статистики №4, 5, 6","D":"2026-10-16T16:00","K":17},{"N":22,"T":"Повторение тригонометрии","D":"2026-10-19T16:00","K":8},{"N":23,"T":"Повторение признаков равенства и подобия треугольников","D":"2026-10-20T18:00","K":5},{"N":24,"T":"Сложная планиметрия №18","D":"2026-10-21T18:00","K":3},{"N":25,"T":"Вебинар с Методистом","D":"2026-10-22T18:00","K":1},{"N":26,"T":"Производная и функция №9","D":"2026-10-23T16:00","K":17},{"N":27,"T":"Графики №12","D":"2026-10-26T16:00","K":17},{"N":28,"T":"Простая планиметрия №18","D":"2026-10-27T18:00","K":4},{"N":29,"T":"Сложная планиметрия №18","D":"2026-10-28T18:00","K":3},{"N":30,"T":"Вебинар с Методистом","D":"2026-10-29T18:00","K":1},{"N":31,"T":"Графики №12","D":"2026-10-30T16:00","K":16},{"N":32,"T":"Текстовые задачи №10","D":"2026-11-02T16:00","K":9},{"N":33,"T":"Простая планиметрия №18","D":"2026-11-03T18:00","K":4},{"N":34,"T":"Сложная планиметрия №18","D":"2026-11-04T18:00","K":3},{"N":35,"T":"Вебинар с Методистом","D":"2026-11-05T18:00","K":1},{"N":36,"T":"Экономические задачи №13","D":"2026-11-06T16:00","K":8}],"inf":[{"N":1,"T":"Задание №4 Условие Фано","D":"2026-09-15T16:00","K":10},{"N":2,"T":"Задание №7 Кодирование изображений","D":"2026-09-17T16:00","K":10},{"N":3,"T":"Задание №7 Кодирование звуков","D":"2026-09-19T15:00","K":8},{"N":4,"T":"Задание №7 Кодирование. Сложные задания","D":"2026-09-22T16:00","K":10},{"N":5,"T":"Задание №11 Кодирование символов","D":"2026-09-24T16:00","K":9},{"N":6,"T":"Практика по кодированию информации","D":"2026-09-26T15:00","K":12},{"N":7,"T":"Задание №1 Графы (видеоурок)","D":"2026-09-29T16:00","K":12},{"N":8,"T":"Электронные таблицы c нуля (видеоурок)","D":"2026-10-01T16:00","K":6},{"N":9,"T":"Задание №3 Базовые задания","D":"2026-10-03T15:00","K":8},{"N":10,"T":"Задание №18 Базовые задания","D":"2026-10-06T16:00","K":6},{"N":11,"T":"Задание №3 и №18. Сложные типы","D":"2026-10-08T16:00","K":9},{"N":12,"T":"Задание №9 часть 1","D":"2026-10-10T15:00","K":7},{"N":13,"T":"Задание №9 часть 2","D":"2026-10-13T16:00","K":8},{"N":14,"T":"Повторение. Задание №7 за 1 веб","D":"2026-10-15T16:00","K":10},{"N":15,"T":"Повторение. Задание №11. Аналитика + с помощью электронных таблиц","D":"2026-10-17T15:00","K":10},{"N":16,"T":"Задание №22 часть 1","D":"2026-10-20T16:00","K":6},{"N":17,"T":"Задание №22 часть 2","D":"2026-10-22T16:00","K":6},{"N":18,"T":"Системы счисления (видеоурок)","D":"2026-10-24T15:00","K":16},{"N":19,"T":"Задание №8 Аналитика, базовые задачи","D":"2026-10-27T16:00","K":13},{"N":20,"T":"Задание №8 Сложные типы","D":"2026-10-29T16:00","K":11},{"N":21,"T":"Задание №10 Теория + легкие типы","D":"2026-10-31T15:00","K":12},{"N":22,"T":"Задание №10 Аналитика с помощью электронных таблиц","D":"2026-11-03T16:00","K":9},{"N":23,"T":"Задание №26 часть 1 с помощью электронных таблиц","D":"2026-11-05T16:00","K":4}]};

const SUBJECTS = [
  { id:'math', name:'Математика', course:'Легион Ильича', color:'#7c5cff', courseId:3082 },
  { id:'inf',  name:'Информатика', course:'Флэш',          color:'#2ecc71', courseId:3086 }
];
const KEY = 'ege_catchup_v1';
const SITE = 'https://lk.100points.ru/student/calendar';

/* ================= состояние ================= */
let storageBroken = false;

function defaultState(){
  return {
    token:'',
    tab:'today',
    planSubj:'math',
    watched:{ math: range(1,10), inf: range(1,10) },
    data:null,
    dataAt:'',
    dataTs:0,
    lastError:'',
    settings:{ time:'19:00', days:7, notify:false, lastNotified:'' }
  };
}
function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    return {
      ...d, ...s,
      watched:{ ...d.watched, ...(s.watched||{}) },
      settings:{ ...d.settings, ...(s.settings||{}) }
    };
  }catch(e){ return defaultState(); }
}
let state = loadState();

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageBroken = true; }
}

/* ================= вычисления ================= */
const pad = n => String(n).padStart(2,'0');
function todayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }

function data(){ return state.data || DATA_DEFAULT; }
function list(id){ return (data()[id]||[]).slice().sort((a,b)=>a.N-b.N); }
function targetNo(id){
  const t = todayKey();
  let best = 0;
  for(const l of list(id)) if(l.D && l.D.slice(0,10) <= t) best = Math.max(best, l.N);
  return best;
}
function watchedSet(id){ return new Set(state.watched[id]||[]); }
function currentNo(id){ const w=state.watched[id]||[]; return w.length? Math.max(...w) : 0; }
function remaining(id){
  const w = watchedSet(id), t = targetNo(id);
  return list(id).filter(l => l.N <= t && !w.has(l.N));
}
function future(id){
  const t = targetNo(id);
  return list(id).filter(l => l.N > t).slice(0,4);
}
function tasksSum(arr){ return arr.reduce((s,l)=>s+(l.K||0),0); }
function todayLesson(id){ const t=todayKey(); return list(id).find(l=>l.D && l.D.slice(0,10)===t) || null; }
function perDay(id){
  const r = remaining(id).length;
  return r ? Math.max(1, Math.ceil(r / Math.max(1, state.settings.days))) : 0;
}
function plural(n, one, few, many){
  const a = Math.abs(n)%100, b = a%10;
  if(a>10 && a<20) return many;
  if(b>1 && b<5) return few;
  if(b===1) return one;
  return many;
}
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
function humanDate(iso){
  if(!iso) return 'дата не назначена';
  const [d,t] = iso.split('T');
  const [y,m,dd] = d.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  return dd+' '+MONTHS[m-1]+(t?', '+t:'')+' · '+WD[dt.getDay()];
}
function shortDate(iso){
  if(!iso) return '';
  const [d,t] = iso.split('T');
  const [,m,dd] = d.split('-').map(Number);
  return dd+'.'+pad(m)+(t?' '+t:'');
}

/* ================= рендер ================= */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const root = document.getElementById('root');
  const r = state.tab==='plan' ? viewPlan() : state.tab==='set' ? viewSettings() : viewToday();
  root.innerHTML = r;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===state.tab));
  if(state.tab==='set') updateNotifyStatus();
}

function subjMeta(id){ return SUBJECTS.find(s=>s.id===id); }

function syncLine(){
  if(!state.token)
    return 'Данные от 5 ноября 2026 · <button class="lnk" data-act="tab" data-tab="set">подключить авто-обновление</button>';
  if(state.lastError)
    return '<span class="warn">не обновилось: '+esc(state.lastError)+'</span> · <button class="lnk" data-act="sync">повторить</button>';
  if(state.dataTs){
    const min = Math.round((Date.now()-state.dataTs)/60000);
    const ago = min < 1 ? 'только что' : min < 60 ? min+' мин назад' : Math.round(min/60)+' ч назад';
    return '<span class="ok">актуально · обновлено '+ago+'</span> · <button class="lnk" data-act="sync">обновить</button>';
  }
  return 'обновляю данные…';
}

function viewToday(){
  const tKey = todayKey();
  const dt = new Date();
  const dateStr = dt.getDate()+' '+MONTHS[dt.getMonth()]+' '+dt.getFullYear()+', '+WD[dt.getDay()];

  let totalRem = 0, totalTasks = 0, totalPerDay = 0;
  const cards = SUBJECTS.map(s=>{
    const all = list(s.id), tgt = targetNo(s.id), cur = currentNo(s.id);
    const rem = remaining(s.id), tasks = tasksSum(rem);
    const pd = perDay(s.id);
    totalRem += rem.length; totalTasks += tasks; totalPerDay += pd;
    const prog = tgt ? Math.min(100, Math.round(cur/tgt*100)) : 100;
    const tl = todayLesson(s.id);
    return `
      <div class="card">
        <div class="row between">
          <div class="row grow">
            <span class="dot" style="background:${s.color}"></span>
            <div class="grow">
              <div class="name">${s.name}</div>
              <div class="small muted">${s.course}</div>
            </div>
          </div>
          <div style="text-align:right">
            <div class="goal">${tgt ? 'Урок '+tgt : '—'}</div>
            <div class="small muted">цель на сегодня</div>
          </div>
        </div>
        ${tl ? `<div class="small muted" style="margin-top:8px">Сегодня по расписанию: <span style="color:#cfd7e6">урок ${tl.N}</span> в ${tl.D.slice(11,16)}</div>` : ''}
        <div class="bar"><i style="width:${prog}%;background:${s.color}"></i></div>
        <div class="chips">
          <span class="chip">ты на <b>${cur}</b></span>
          <span class="chip">осталось <b>${rem.length}</b> ${plural(rem.length,'вебинар','вебинара','вебинаров')}</span>
          <span class="chip">заданий <b>${tasks}</b></span>
          ${pd?`<span class="chip">план дня: <b>${pd}</b></span>`:''}
        </div>
        <div style="margin-top:12px" class="row">
          <button class="btn ghost sm" data-act="openplan" data-subj="${s.id}">Список уроков →</button>
        </div>
      </div>`;
  }).join('');

  const pace = totalPerDay ? `по ${totalPerDay} ${plural(totalPerDay,'вебинару','вебинара','вебинаров')} в день — догонишь за ${state.settings.days} ${plural(state.settings.days,'день','дня','дней')}` : 'всё просмотрено до сегодняшнего урока';

  const queue = [];
  SUBJECTS.forEach(s=>{
    remaining(s.id).slice(0, perDay(s.id)).forEach(l=>queue.push({s, l}));
  });
  queue.sort((a,b)=> a.s.id===b.s.id ? a.l.N-b.l.N : (a.s.id<b.s.id?-1:1));

  const queueHtml = queue.length ? `
    <h2>План на сегодня · ${queue.length} ${plural(queue.length,'вебинар','вебинара','вебинаров')}</h2>
    <div class="card" style="padding:6px 14px">
      ${queue.map(({s,l})=>lessonRow(s, l, false)).join('')}
    </div>
    <div class="hint" style="margin:2px 4px 0">Отмечай просмотренное — счётчик и план пересчитаются.</div>
  ` : `
    <div class="card empty"><span class="e">🎉</span>Ты догнал сегодняшний номер.<br><span class="small">Дальше — по расписанию. Новые уроки появятся в плане.</span></div>
  `;

  return `
    <h1>Догнать до сегодня</h1>
    <div class="sub">${dateStr}</div>
    <div class="small" style="margin-top:6px;color:#8b95a8">${syncLine()}</div>

    <div class="card big" style="margin-top:14px">
      <div class="row between" style="align-items:flex-start">
        <div>
          <div class="small muted">Осталось посмотреть</div>
          <div class="bignum">${totalRem} <span style="font-size:16px;font-weight:600;color:#9aa6bb">${plural(totalRem,'вебинар','вебинара','вебинаров')}</span></div>
          <div class="small muted" style="margin-top:6px">${totalTasks} ${plural(totalTasks,'задание','задания','заданий')} в домашках</div>
        </div>
        <div style="text-align:right">
          <div class="pill">${state.settings.days} ${plural(state.settings.days,'день','дня','дней')} на догон</div>
        </div>
      </div>
      <div class="hint" style="margin-top:10px">${pace}</div>
    </div>

    <h2>Предметы</h2>
    ${cards}
    ${queueHtml}

    <div class="card tight" style="margin-top:14px">
      <div class="row between">
        <div class="grow">
          <div class="name" style="font-size:14px">Напоминание на телефон</div>
          <div class="small muted">Импортируй в календарь — будет звонить каждый день в ${state.settings.time}</div>
        </div>
        <button class="btn sm primary" data-act="ics">В календарь</button>
      </div>
    </div>
  `;
}

function lessonRow(s, l, futureMode){
  const w = watchedSet(s.id).has(l.N);
  const done = w && !futureMode;
  return `
    <div class="lesson ${futureMode?'future':''}">
      <button class="cb ${done?'on':''}" aria-pressed="${done?'true':'false'}" aria-label="Урок ${l.N}" data-act="toggle" data-subj="${s.id}" data-n="${l.N}"
        ${futureMode?'disabled style="opacity:.4"':''}>✓</button>
      <div class="grow">
        <div class="lt ${done?'done':''}">Урок ${l.N}. ${esc(l.T)}</div>
        <div class="ld">${humanDate(l.D)}</div>
      </div>
      <div style="text-align:right">
        <span class="tasks">${l.K} ${plural(l.K,'задание','задания','заданий')}</span>
      </div>
    </div>`;
}

function viewPlan(){
  const s = subjMeta(state.planSubj);
  const all = list(s.id), tgt = targetNo(s.id), cur = currentNo(s.id);
  const rem = remaining(s.id);
  const fut = future(s.id);
  const w = watchedSet(s.id);
  const prog = tgt ? Math.min(100, Math.round(w.size/tgt*100)) : 100;

  const rows = all.map(l=>{
    const isFut = l.N > tgt;
    return lessonRow(s, l, isFut);
  }).join('');

  return `
    <h1>План</h1>
    <div class="sub">Отмечай то, что уже посмотрел</div>
    <div class="seg" style="margin-top:14px">
      ${SUBJECTS.map(x=>`<button class="${x.id===s.id?'on':''}" data-act="plansubj" data-subj="${x.id}">
        <span class="dot" style="background:${x.color};display:inline-block;margin-right:6px;vertical-align:middle"></span>${x.name}</button>`).join('')}
    </div>
    <div class="card">
      <div class="row between">
        <div><div class="small muted">Догнать до</div><div class="goal">Урок ${tgt||'—'}</div></div>
        <div style="text-align:right"><div class="small muted">Ты на</div><div class="goal">${cur}</div></div>
      </div>
      <div class="bar"><i style="width:${prog}%;background:${s.color}"></i></div>
      <div class="chips">
        <span class="chip">осталось <b>${rem.length}</b></span>
        <span class="chip">заданий <b>${tasksSum(rem)}</b></span>
        <span class="chip">план дня <b>${perDay(s.id)}</b></span>
      </div>
      ${rem.length?`<div style="margin-top:12px"><button class="btn ghost sm" data-act="markall" data-subj="${s.id}" data-n="${tgt}">Я посмотрел всё до урока ${tgt}</button></div>`:''}
    </div>
    <div class="card" style="padding:6px 14px">${rows || '<div class="empty">Пока нет уроков</div>'}</div>
    ${fut.length?`<div class="hint" style="margin:0 4px 14px">Скоро выйдут: ${fut.map(l=>'№'+l.N).join(', ')} — они станут активными в день вебинара.</div>`:''}
  `;
}

/* ================= напоминания ================= */
function updateNotifyStatus(){
  const el = document.getElementById('nstat');
  if(!el) return;
  if(!('Notification' in window)){ el.textContent = 'не поддерживается'; return; }
  el.textContent = Notification.permission==='granted' ? 'разрешены' :
                   Notification.permission==='denied' ? 'запрещены в браузере' : 'нужно разрешение';
}

async function notifyTick(){
  if(!state.settings.notify) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const t = todayKey();
  if(state.settings.lastNotified === t) return;
  if(nowHM() < state.settings.time) return;

  const parts = SUBJECTS.map(s=>{
    const r = remaining(s.id);
    return r.length ? `${s.name}: ${r.length} ${plural(r.length,'вебинар','вебинара','вебинаров')} до урока ${targetNo(s.id)}` : `${s.name}: догнал`;
  });
  const body = parts.join(' · ');
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification) await reg.showNotification('ЕГЭ: план на сегодня', { body, tag:'ege-daily' });
    else new Notification('ЕГЭ: план на сегодня', { body, tag:'ege-daily' });
    state.settings.lastNotified = t; save();
  }catch(e){ /* на Android без service worker нельзя — используем календарь */ }
}

/* ================= .ics ================= */
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function fold(line){
  const enc = new TextEncoder();
  if(enc.encode(line).length <= 73) return line;
  let out = '', cur = '';
  for(const ch of line){
    if(enc.encode(cur+ch).length > 73){ out += cur + '\r\n '; cur = ch; }
    else cur += ch;
  }
  return out + cur;
}

function buildICS(){
  const L = [];
  L.push('BEGIN:VCALENDAR');
  L.push('VERSION:2.0');
  L.push('PRODID:-//ege-plan//RU');
  L.push('CALSCALE:GREGORIAN');
  L.push('METHOD:PUBLISH');
  L.push('X-WR-CALNAME:ЕГЭ — догонялка');

  const [hh,mm] = state.settings.time.split(':').map(Number);
  const stamp = (d)=> d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(hh)+pad(mm)+'00';

  // ежедневное напоминание
  const start = new Date(); start.setHours(hh,mm,0,0);
  if(start < new Date()) start.setDate(start.getDate()+1);
  L.push('BEGIN:VEVENT');
  L.push('UID:ege-daily-'+Date.now()+'@local');
  L.push('DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\..*/,'Z'));
  L.push('DTSTART:'+stamp(start));
  L.push('DURATION:PT15M');
  L.push('RRULE:FREQ=DAILY;COUNT=120');
  L.push('SUMMARY:ЕГЭ: догнать план');
  L.push('DESCRIPTION:'+icsEscape(dailyText()));
  L.push('URL:'+SITE);
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('TRIGGER:-PT0M');
  L.push('DESCRIPTION:ЕГЭ: посмотри план на сегодня');
  L.push('END:VALARM');
  L.push('END:VEVENT');

  // конкретные уроки на ближайшие дни
  const days = Math.max(1, state.settings.days);
  const queues = SUBJECTS.map(s=>({ s, items: remaining(s.id).slice(0, days*12) }));
  for(let d=1; d<=days; d++){
    const date = new Date(); date.setDate(date.getDate()+d); date.setHours(hh,mm,0,0);
    for(const q of queues){
      const pd = perDay(q.s.id);
      const chunk = q.items.splice(0, pd);
      if(!chunk.length) continue;
      L.push('BEGIN:VEVENT');
      L.push('UID:ege-'+q.s.id+'-'+d+'-'+Date.now()+'@local');
      L.push('DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\..*/,'Z'));
      L.push('DTSTART:'+stamp(date));
      L.push('DURATION:PT45M');
      L.push('SUMMARY:'+icsEscape(q.s.name+': уроки '+chunk.map(x=>x.N).join(', ')));
      L.push('DESCRIPTION:'+icsEscape(chunk.map(x=>'Урок '+x.N+'. '+x.T).join('\n')));
      L.push('URL:'+SITE);
      L.push('BEGIN:VALARM');
      L.push('ACTION:DISPLAY');
      L.push('TRIGGER:-PT10M');
      L.push('DESCRIPTION:'+icsEscape(q.s.name+': урок '+chunk[0].N));
      L.push('END:VALARM');
      L.push('END:VEVENT');
    }
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n');
}

function dailyText(){
  return SUBJECTS.map(s=>{
    const r = remaining(s.id);
    if(!r.length) return s.name+': всё просмотрено';
    return s.name+': осталось '+r.length+' до урока '+targetNo(s.id)+', начни с урока '+r[0].N+'.';
  }).join(' ')+' План: открой приложение.';
}

function downloadICS(){
  const text = buildICS();
  const blob = new Blob(['\ufeff'+text], { type:'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ege-napominaniya.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Файл скачан. Открой его — телефон добавит события в календарь');
}

/* ================= синхронизация ================= */
async function sync(silent){
  const st = document.getElementById('syncstat');
  if(!state.token){ if(!silent) toast('Сначала вставь токен'); return; }
  if(st) st.textContent = 'Обновляю…';
  const h = { Authorization:'Bearer '+state.token, Accept:'application/json' };
  try{
    const schedRes = await fetch('https://api.100points.ru/api/student/schedule', { headers:h });
    if(schedRes.status===401) throw new Error('Токен не подошёл или устарел');
    if(!schedRes.ok) throw new Error('Сайт ответил '+schedRes.status);
    const sched = await schedRes.json();

    const dates = new Map();
    for(const x of sched) if(x && x.title && x.start_at){
      const [dd,mm,yy] = x.start_at.slice(0,10).split('.');
      dates.set(x.title.trim(), yy+'-'+mm+'-'+dd+'T'+x.start_at.slice(11,16));
    }

    const fresh = {};
    for(const s of SUBJECTS){
      let all = [], page = 1, last = 1;
      do{
        const r = await fetch('https://api.100points.ru/api/student/courses/'+s.courseId+'/lessons?page='+page, { headers:h });
        if(!r.ok) throw new Error('Сайт ответил '+r.status);
        const j = await r.json();
        all = all.concat(j.lessons||[]);
        last = (j.pagination && j.pagination.last_page) || 1;
        page++;
      }while(page <= last && page <= 8);

      fresh[s.id] = all
        .filter(l => /Урок\s*№?\s*\d+/i.test(l.title||''))
        .map(l=>{
          const m = l.title.match(/Урок\s*№?\s*(\d+)/i);
          return {
            N: +m[1],
            T: l.title.replace(/^Урок\s*№?\s*\d+\.\s*/i,''),
            D: dates.get(l.title.trim()) || '',
            K: (l.first_homework && l.first_homework.tasks_count) || 0
          };
        })
        .sort((a,b)=>a.N-b.N);
    }
    state.data = fresh;
    state.dataAt = new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
    state.dataTs = Date.now();
    state.lastError = '';
    save();
    if(!(silent && document.activeElement && document.activeElement.tagName==='INPUT')) render();
    if(!silent) toast('Обновлено: '+SUBJECTS.map(s=>fresh[s.id].length+' уроков').join(', '));
    const st2 = document.getElementById('syncstat');
    if(st2) st2.textContent = 'Готово. Данные от '+state.dataAt+'.';
  }catch(e){
    state.lastError = e.message;
    save();
    if(st) st.textContent = 'Ошибка: '+e.message;
    if(!silent) toast('Не получилось: '+e.message);
  }
}

/* ================= действия ================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}

function setCurrent(id, n){
  n = Math.max(0, Math.min(99, n|0));
  state.watched[id] = n ? range(1,n) : [];
  save();
}
function toggle(id, n){
  const w = new Set(state.watched[id]||[]);
  if(w.has(n)) w.delete(n); else w.add(n);
  state.watched[id] = [...w].sort((a,b)=>a-b);
  save();
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act==='tab'){ state.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0); }
  else if(act==='plansubj'){ state.planSubj = el.dataset.subj; save(); render(); }
  else if(act==='openplan'){ state.planSubj = el.dataset.subj; state.tab='plan'; save(); render(); window.scrollTo(0,0); }
  else if(act==='toggle'){ toggle(el.dataset.subj, +el.dataset.n); render(); }
  else if(act==='markall'){ setCurrent(el.dataset.subj, +el.dataset.n); render(); toast('Отмечено до урока '+el.dataset.n); }
  else if(act==='ics'){ downloadICS(); }
  else if(act==='sync'){ sync(); }
  else if(act==='reset'){
    if(confirm('Сбросить прогресс? Текущий урок станет 0.')){
      state.watched = { math:[], inf:[] }; save(); render(); toast('Прогресс сброшен');
    }
  }
});

document.addEventListener('change', async (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act==='setcur'){ setCurrent(el.dataset.subj, +el.value||0); render(); }
  else if(act==='token'){ state.token = el.value.trim(); save(); toast('Токен сохранён'); }
  else if(act==='settime'){ state.settings.time = el.value || '19:00'; state.settings.lastNotified=''; save(); render(); }
  else if(act==='setdays'){ state.settings.days = Math.max(1, +el.value||7); save(); render(); }
  else if(act==='notify'){
    if(el.checked){
      if(!('Notification' in window)){ toast('Браузер не поддерживает уведомления'); el.checked=false; return; }
      const p = await Notification.requestPermission();
      if(p!=='granted'){ toast('Разрешение не выдано — используй .ics'); el.checked=false; state.settings.notify=false; save(); updateNotifyStatus(); return; }
      state.settings.notify = true; save(); toast('Уведомления включены');
    } else { state.settings.notify = false; save(); }
    updateNotifyStatus();
  }
});

/* ================= старт ================= */
render();
notifyTick();
if(state.token) sync(true);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.token && Date.now()-state.dataTs > 30*60*1000) sync(true);
});
setInterval(()=>{
  notifyTick();
  if(state.token && Date.now()-state.dataTs > 3*3600*1000) sync(true);
}, 60000);
</script>
