<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Догонялка">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Догонялка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230A84FF'/%3E%3Cstop offset='1' stop-color='%235E5CE6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M20 34l8 8 16-18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(120,120,128,.12);
    --label:#000; --secondary:rgba(60,60,67,.6); --tertiary:rgba(60,60,67,.3);
    --sep:rgba(60,60,67,.14); --tab:rgba(249,249,249,.86);
    --blue:#007AFF; --green:#34C759; --orange:#FF9500; --purple:#AF52DE; --red:#FF3B30;
    --hero1:#0A84FF; --hero2:#5E5CE6;
    --shadow:0 1px 3px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000; --card:#1C1C1E; --fill:rgba(120,120,128,.24);
      --label:#fff; --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.6); --tab:rgba(22,22,22,.84); --shadow:none;
      --blue:#0A84FF;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--label);
    font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit}
  .app{max-width:600px;margin:0 auto;padding:6px 16px 10px}
  .lt{font-size:40px;font-weight:800;letter-spacing:-1.6px;margin:16px 0 2px;line-height:1.04}
  .sub{color:var(--secondary);font-size:15.5px;letter-spacing:-.1px}
  .gh{font-size:12px;letter-spacing:.055em;text-transform:uppercase;color:var(--secondary);margin:26px 0 8px 4px;font-weight:650}
  .group{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;background:none;border:0;
       font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;min-height:44px}
  .row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
  .row:active{background:var(--fill)}
  .rt{font-size:17px;line-height:1.3}
  .rs{font-size:13px;color:var(--secondary);margin-top:2px;line-height:1.3}
  .rt.done{color:var(--secondary);text-decoration:line-through}
  .grow{flex:1;min-width:0}
  .chev{color:var(--tertiary);display:flex;flex:none}
  .chev svg{width:18px;height:18px}

  .hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-radius:26px;padding:24px 22px 20px;
        color:#fff;box-shadow:0 22px 46px -16px rgba(10,132,255,.65);margin:18px 0 6px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:-45%;z-index:0;pointer-events:none;
        background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.55),transparent 42%),
                   radial-gradient(circle at 82% 88%,rgba(255,255,255,.32),transparent 38%);
        animation:aurora 16s ease-in-out infinite alternate}
  .hero::after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;
        background:rgba(255,255,255,.10);right:-70px;top:-95px}
  .hero>*{position:relative;z-index:1}
  @keyframes aurora{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(5%,4%,0) scale(1.14)}}
  .hero .n{font-size:68px;font-weight:800;letter-spacing:-3.4px;line-height:.92;font-variant-numeric:tabular-nums}
  .hero .l{font-size:16px;opacity:.95;margin-top:7px;max-width:86%;letter-spacing:-.1px}
  .hero .f{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hero .pill{background:rgba(255,255,255,.20);border:.5px solid rgba(255,255,255,.26);
        border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  .subj{display:flex;align-items:center;gap:14px;padding:14px 15px;background:var(--card);border-radius:20px;
        margin-bottom:10px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;font:inherit;color:inherit;
        transition:transform .22s cubic-bezier(.32,.72,0,1),box-shadow .22s}
  .subj:active{transform:scale(.985)}
  .ring{width:48px;height:48px;flex:none;position:relative}
  .ring svg{width:48px;height:48px;transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:650;color:var(--label);font-variant-numeric:tabular-nums}
  .sname{font-size:17.5px;font-weight:650;line-height:1.22;letter-spacing:-.2px}
  .scourse{font-size:12.5px;color:var(--secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .smeta{font-size:13px;color:var(--secondary);margin-top:4px}

  /* сводка в плане */
  .sum{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 15px;margin:16px 0 12px}
  .sum-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
  .sum-cell{flex:none;min-width:0}
  .sum-cell.right{text-align:right}
  .sum-cell.right .sum-num{justify-content:flex-end}
  .sum-cap{font-size:11.5px;color:var(--secondary);font-weight:650;letter-spacing:.03em;text-transform:uppercase}
  .sum-num{font-size:40px;font-weight:800;letter-spacing:-1.8px;line-height:1;margin-top:3px;font-variant-numeric:tabular-nums;
        display:flex;align-items:baseline;gap:5px}
  .sum-u{font-size:13px;font-weight:650;letter-spacing:-.1px;color:var(--secondary);white-space:nowrap}
  .sum-bar{margin-top:15px}
  .bar{height:9px;border-radius:99px;background:var(--fill);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hero1),var(--hero2));
        transition:width .7s cubic-bezier(.32,.72,0,1)}
  .sum-goal{font-size:13px;color:var(--secondary);margin-top:10px}
  .sum-foot{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .dayline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
        margin:22px 0 9px 4px;font-size:15px;font-weight:500;letter-spacing:-.1px}
  .dayline b{font-weight:700;color:var(--blue)}
  .dayline .dc{font-size:13px;color:var(--secondary);font-weight:500;white-space:nowrap}
  .chip{font-size:12.5px;font-weight:600;color:var(--label);background:var(--fill);border-radius:999px;padding:6px 11px}
  .chip.acc{color:var(--blue);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 30%,transparent)}

  /* появление при скролле */
  [data-reveal]{opacity:0;transform:translateY(16px);
        transition:opacity .6s cubic-bezier(.32,.72,0,1),transform .6s cubic-bezier(.32,.72,0,1)}
  [data-reveal].in{opacity:1;transform:none}

  .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--tertiary);flex:none;
      display:grid;place-items:center;color:transparent;transition:background .18s,border-color .18s,transform .18s}
  .ck svg{width:15px;height:15px;stroke-width:2.6}
  .ck.on{background:var(--green);border-color:var(--green);color:#fff}
  .pop{animation:pop .32s cubic-bezier(.32,.72,0,1)}
  @keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.14)}100%{transform:scale(1)}}

  .seg{display:flex;background:var(--fill);border-radius:11px;padding:3px;margin:14px 0 4px;gap:2px}
  .seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--label);
       padding:7px 8px;border-radius:8px;transition:background .2s,box-shadow .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}

  .btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;
       font:inherit;font-size:17px;font-weight:600;padding:15px;text-align:center;cursor:pointer;
       transition:transform .16s cubic-bezier(.32,.72,0,1),opacity .16s}
  .btn:active{transform:scale(.975);opacity:.9}
  .btn:disabled{opacity:.4;transform:none}
  .btn.sec{background:var(--fill);color:var(--blue)}
  .btn.danger{background:var(--fill);color:var(--red)}
  .btn.sm{font-size:15px;padding:11px;border-radius:12px}

  .field{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;min-height:44px}
  .field + .field::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
  .field label{flex:1;font-size:17px}
  input,select{font:inherit;font-size:16px;color:var(--label);background:var(--fill);border:1px solid transparent;
       border-radius:11px;padding:10px 12px;width:100%;min-width:0}
  input:focus{outline:none;border-color:var(--blue);background:var(--card);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
  input[type=time]{width:112px;text-align:center}
  input[type=number]{width:74px;text-align:center}

  .sw{position:relative;width:51px;height:31px;flex:none}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw i{position:absolute;inset:0;background:rgba(120,120,128,.32);border-radius:999px;transition:background .25s}
  .sw i::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;
       box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  .sw input:checked + i{background:var(--green)}
  .sw input:checked + i::after{transform:translateX(20px)}

  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);
       font-size:20px;font-weight:600;display:grid;place-items:center;line-height:1;cursor:pointer}
  .stepper b{min-width:26px;text-align:center;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
       background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
       border-top:.5px solid var(--sep);padding:7px 0 calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
       color:var(--secondary);font:inherit;font-size:10.5px;font-weight:500;padding:0}
  .tab svg{width:26px;height:26px}
  .tab.on{color:var(--blue)}

  .ob{max-width:600px;margin:0 auto;padding:22px 20px 34px;min-height:100vh;display:flex;flex-direction:column}
  .ob h2{font-size:32px;font-weight:700;letter-spacing:-.8px;margin:10px 0 8px;line-height:1.15}
  .ob p{color:var(--secondary);font-size:16px;line-height:1.45;margin:0 0 14px}
  .spacer{flex:1;min-height:20px}
  .dots{display:flex;gap:6px;justify-content:center;margin:18px 0 0}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--tertiary);transition:.25s}
  .dot.on{background:var(--blue);width:18px;border-radius:9px}
  .big{font-size:64px;line-height:1;margin:6px 0 14px}

  /* первый экран — как продуктовая страница */
  .land{padding-top:6px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:var(--blue);
         background:var(--fill);border-radius:999px;padding:7px 12px;margin-bottom:22px}
  .badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .land h1{font-size:44px;line-height:1.03;letter-spacing:-2px;font-weight:800;margin:0 0 14px}
  .land h1 em{font-style:normal;background:linear-gradient(115deg,var(--hero1),var(--hero2));
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .land .lead{font-size:17px;line-height:1.45;color:var(--secondary);margin:0 0 22px;max-width:95%}
  .orb{width:132px;height:132px;margin:2px auto 26px;position:relative}
  .orb .o1{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;
        background:radial-gradient(circle at 32% 26%,#9AD6FF,var(--hero1) 46%,var(--hero2));
        box-shadow:0 26px 54px -16px rgba(10,132,255,.7);animation:float 6.5s ease-in-out infinite}
  .orb .o1 svg{width:58px;height:58px;stroke-width:2.3}
  .orb .o2,.orb .o3{position:absolute;border-radius:50%;border:1px solid var(--sep)}
  .orb .o2{inset:-16px;animation:pulse 6.5s ease-in-out infinite}
  .orb .o3{inset:-34px;opacity:.55;animation:pulse 6.5s ease-in-out infinite .5s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.035);opacity:.85}}
  .feat{display:flex;gap:13px;align-items:flex-start;margin-bottom:14px}
  .feat .fi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--fill);color:var(--blue);flex:none}
  .feat .fi svg{width:19px;height:19px}
  .feat .ft{font-size:15px;font-weight:650;line-height:1.3;letter-spacing:-.1px}
  .feat .fd{font-size:13.5px;color:var(--secondary);margin-top:2px;line-height:1.35}
  @media (max-height:700px){
    .orb{width:100px;height:100px;margin-bottom:16px}
    .orb .o1 svg{width:42px;height:42px}
    .land h1{font-size:34px}
    .land .lead{font-size:15.5px;margin-bottom:16px}
    .badge{margin-bottom:14px}
    .feat{margin-bottom:10px}
  }

  .course{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;cursor:pointer}
  .course + .course::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
  .avatar{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  .sel{width:22px;height:22px;border-radius:50%;border:2px solid var(--tertiary);flex:none;display:grid;place-items:center;color:transparent}
  .sel.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .sel svg{width:13px;height:13px;stroke-width:3}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(96px + env(safe-area-inset-bottom));
       background:rgba(30,30,32,.92);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:60;
       opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fade{animation:fade .28s cubic-bezier(.32,.72,0,1)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
       animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:30px 22px;color:var(--secondary)}
  .empty .e{font-size:40px;display:block;margin-bottom:8px}
  .empty .ico{width:62px;height:62px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;
              background:var(--fill);color:var(--blue)}
  .empty .ico svg{width:30px;height:30px}
  .empty .et{display:block;font-size:16.5px;font-weight:600;color:var(--label)}
  .empty .ed{display:block;font-size:13.5px;margin-top:4px;line-height:1.4}
  .tag{font-size:12px;font-weight:600;color:var(--secondary);background:var(--fill);border-radius:8px;padding:3px 8px;white-space:nowrap}
  .ok{color:var(--green)} .warn{color:var(--orange)}
  a{color:var(--blue);text-decoration:none}
  .note{font-size:13px;color:var(--secondary);line-height:1.45;padding:10px 4px 0}
  details summary{list-style:none;cursor:pointer}
  details summary::-webkit-details-marker{display:none}
  .lnk{background:none;border:0;padding:0;color:var(--blue);font:inherit;cursor:pointer}

  /* переходы между экранами */
  .slide-l{animation:slideL .3s cubic-bezier(.32,.72,0,1)}
  .slide-r{animation:slideR .3s cubic-bezier(.32,.72,0,1)}
  @keyframes slideL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

  /* обложки курсов */
  .cover{width:52px;height:52px;border-radius:14px;flex:none;background:var(--fill);position:relative;overflow:hidden;
         box-shadow:0 1px 3px rgba(0,0,0,.10)}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cover.ph{display:grid;place-items:center;color:#fff;font-weight:700;font-size:21px;box-shadow:none}
  .ring.sm,.ring.sm svg{width:42px;height:42px}
  .ring.sm b{font-size:11px}

  /* выбор акцента */
  .swatches{display:flex;gap:16px;padding:4px 16px 16px}
  .swatch{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;
          cursor:pointer;transition:transform .16s cubic-bezier(.32,.72,0,1)}
  .swatch svg{width:16px;height:16px;stroke-width:3}
  .swatch:active{transform:scale(.9)}
  .swatch.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--label)}

  /* конфетти */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .confetti i{position:absolute;top:30%;display:block;animation:conf 1.9s cubic-bezier(.2,.6,.4,1) forwards}
  @keyframes conf{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}
                  100%{opacity:0;transform:translate3d(var(--x),72vh,0) rotate(var(--r))}}

  @media (prefers-reduced-motion:reduce){
    .slide-l,.slide-r,.fade,.pop,.confetti i{animation:none!important}
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/* ======================= константы ======================= */
const KEY = 'ege_app_v2';
const APP_VER = '2.5';
const SITE = 'https://lk.100points.ru/student/calendar';
const API = 'https://api.100points.ru/api';
const PALETTE = ['#007AFF','#AF52DE','#FF9500','#34C759','#FF3B30','#5AC8FA','#FF2D55','#5856D6','#FF9F0A','#30D158'];

const svg = (d, w) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const I = {
  check: svg('<path d="M20 6L9 17l-5-5"/>', 2.6),
  chev: svg('<path d="M9 18l6-6-6-6"/>'),

const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WD_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function humanDate(iso){
  if(!iso) return 'дата не назначена';
  const [d,t]=iso.split('T'); const [y,m,dd]=d.split('-').map(Number);
  const dt=new Date(y,m-1,dd);
  return dd+' '+MONTHS[m-1]+(t?', '+t:'')+' · '+WD[dt.getDay()];
}
function shortDate(iso){
  if(!iso) return '';
  const [d,t]=iso.split('T'); const [,m,dd]=d.split('-').map(Number);
  return dd+'.'+pad(m)+(t?' '+t:'');
}
function plural(n,one,few,many){
  const a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20) return many;
  if(b>1&&b<5) return few;
  if(b===1) return one;
  return many;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function isStandalone(){
  try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }

}

const subjBy = id => state.subjects.find(s=>s.id===id);
function targetNo(s){
  const t=todayKey(); let best=0;
  for(const l of s.lessons) if(l.D && l.D.slice(0,10)<=t) best=Math.max(best,l.N);
  return best;
}
const watchedSet = s => new Set(s.watched||[]);
const currentNo = s => (s.watched&&s.watched.length) ? Math.max(...s.watched) : 0;
function remainingOf(s){
  const w=watchedSet(s), t=targetNo(s);
  return s.lessons.filter(l=>l.N<=t && !w.has(l.N));
}
function futureOf(s){
  const t=targetNo(s);
  return s.lessons.filter(l=>l.N>t);
}
const tasksSum = arr => arr.reduce((a,l)=>a+(l.K||0),0);
function perDayOf(s){
  const r=remainingOf(s).length;
  return r ? Math.max(1, Math.ceil(r/Math.max(1,state.settings.days))) : 0;
}
function todayLessonOf(s){ const t=todayKey(); return s.lessons.find(l=>l.D&&l.D.slice(0,10)===t)||null; }
function lessonOf(s,n){ return s.lessons.find(l=>l.N===n); }

function apiFetch(path, token, opts){
  return fetch(API+path, { ...(opts||{}), headers:{ Authorization:'Bearer '+token, Accept:'application/json', ...((opts&&opts.headers)||{}) } });
}
async function getAllCourses(token){
  const out=[]; let page=1,last=1;
  do{

    if(r.status===401) throw new Error('токен не подошёл');

    const j = await r.json();
    const arr = j.data||j;
    out.push(...arr);

  }while(page<=last && page<=6);
  return out;
}
async function getSchedule(token){

  if(r.status===401) throw new Error('токен не подошёл');
  if(!r.ok) throw new Error('сайт ответил '+r.status);
  return r.json();
}
async function getLessons(token, courseId){
  const out=[]; let page=1,last=1;
  do{
    const r = await apiFetch('/student/courses/'+courseId+'/lessons?page='+page, token);
    if(!r.ok) throw new Error('сайт ответил '+r.status);
    const j = await r.json();
    out.push(...(j.lessons||[]));
    last = (j.pagination&&j.pagination.last_page)||1; page++;
  }while(page<=last && page<=8);
  return out;
}
function dateMapFrom(schedule){
  const m=new Map();
  for(const x of schedule||[]){
    if(!x||!x.start_at||!x.title) continue;
    const [dd,mm,yy]=x.start_at.slice(0,10).split('.');
    m.set(x.title.trim(), yy+'-'+mm+'-'+dd+'T'+x.start_at.slice(11,16));
  }
  return m;
}
function cleanTitle(t){
  return String(t||'').replace(/^Урок\s*№?\s*\d+[\.\s]*/i,'').replace(/^\s*[\.\-–]\s*/,'').trim();
}
function buildLessons(raw, dateMap){
  const parsed=[];
  for(const l of raw){
    const m=String(l.title||'').match(/Урок\s*№?\s*(\d+)/i);
    if(m) parsed.push({ N:+m[1], l });
  }
  let items;
  if(parsed.length>=3){
    items = parsed;
  } else {
    const dated = raw.filter(l=>dateMap.get(String(l.title||'').trim()));
    const src = dated.length ? dated : raw;
    items = src.map((l,i)=>({ N:i+1, l }));
  }
  const seen=new Set(); const res=[];
  for(const {N,l} of items){
    if(!N||seen.has(N)) continue; seen.add(N);
    res.push({
      N,
      T: cleanTitle(l.title),
      D: dateMap.get(String(l.title||'').trim())||'',
      K: (l.first_homework&&l.first_homework.tasks_count)||0,
      passed: l.study_status==='lesson_passed' || (l.lesson_status&&l.lesson_status.value==='passed')
    });
  }
  return res.sort((a,b)=>a.N-b.N);
}
function makeSubject(course, lessons, paletteIndex, current){
  return {
    id:'c'+course.id, courseId:course.id,
    name: course.subject_title || shortCourse(course.title),
    course: course.title,
    cover: course.cover || '',
    color: course.subject_color || PALETTE[paletteIndex%PALETTE.length],
    lessons,
    watched: current>0 ? range(1,current) : []
  };
}
function shortCourse(t){
  const s=String(t||'').replace(/Годовой по [^»]*«([^»]+)»/,'«$1»').replace(/\|.*$/,'').trim();
  return s.length>34 ? s.slice(0,33)+'…' : s;
}
function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }

function ensureDayPlan(){
  const t=todayKey();
  if(state.dayPlan.date===t && state.dayPlan.items && state.dayPlan.items.length) return;
  const items=[];
  for(const s of state.subjects){
    const pd=perDayOf(s);
    remainingOf(s).slice(0,pd).forEach(l=>items.push({ s:s.id, n:l.N }));
  }
  state.dayPlan={ date:t, items };
  save();
}
function extendPlan(){
  const have=new Set(state.dayPlan.items.map(i=>i.s+':'+i.n));
  for(const s of state.subjects){
    const pd=perDayOf(s);
    const add=remainingOf(s).filter(l=>!have.has(s.id+':'+l.N)).slice(0,pd);
    add.forEach(l=>state.dayPlan.items.push({ s:s.id, n:l.N }));
  }
  save();
}
function planDone(){
  return state.dayPlan.items.length>0 && state.dayPlan.items.every(i=>{
    const s=subjBy(i.s); return s && watchedSet(s).has(i.n);
  });
}

function rv(d){ return REVEAL ? ' data-reveal'+(d?' style="transition-delay:'+d+'s"':'') : ''; }

function render(){

  root.innerHTML = '<div class="app '+(state._anim||'fade')+'">'+body+'</div>'+tabbar();
  state._just=''; state._anim='';
  initReveal(); countUp();

function initReveal(){
  const els=[...document.querySelectorAll('[data-reveal]')];
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io=new IntersectionObserver(entries=>{
    for(const en of entries) if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
  }, {threshold:.04, rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>io.observe(e));
  setTimeout(()=>{
    els.forEach(e=>{ if(!e.classList.contains('in') && e.getBoundingClientRect().top < innerHeight) e.classList.add('in'); });
  }, 650);
}

function countUp(){
  if(!REVEAL) return;
  for(const el of document.querySelectorAll('[data-num]')){
    const to=Number(el.dataset.num);
    if(!isFinite(to) || to>9999) continue;
    const t0=Date.now(), dur=700;
    let finished=false;
    const finish=()=>{ if(!finished){ finished=true; el.textContent=to; } };
    const step=()=>{
      if(finished) return;
      const k=Math.min(1,(Date.now()-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=Math.round(to*e);
      if(k<1) requestAnimationFrame(step); else finish();
    };
    requestAnimationFrame(step);
    setTimeout(finish, dur+150);
  }
}

/* ======================= действия онбординга ======================= */
async function obConnect(){
  const inp=document.getElementById('tokenInput');
  const token=(inp?inp.value:state.ob.tokenDraft||'').trim();
  if(!token){ state.ob.err='Вставь токен'; render(); return; }
  state.ob.tokenDraft=token; state.ob.busy=true; state.ob.err=''; render();
  try{
    const courses=await getAllCourses(token);
    state.token=token;
    state.ob.courses=courses;
    state.ob.selected={};
    state.ob.busy=false; state.ob.step=2;
    save(); render();
  }catch(e){
    state.ob.busy=false; state.ob.err=e.message||'не получилось'; render();
  }
}
async function obLoadLessons(){
  state.ob.busy=true; render();
  try{
    const schedule=await getSchedule(state.token);
    const dm=dateMapFrom(schedule);
    state.ob.fetched={ schedule, dm, lessons:{} };
    const ids=Object.keys(state.ob.selected).map(Number);
    for(const id of ids){
      const raw=await getLessons(state.token,id);
      const ls=buildLessons(raw, dm);
      state.ob.fetched.lessons[id]=ls;
      let cur=0;
      for(const l of ls){ if(l.passed) cur=l.N; else break; }
      state.ob.detected=state.ob.detected||{};
      state.ob.detected[id]=cur;
      if(state.ob.progress[id]==null) state.ob.progress[id]=0;
    }
    state.ob.busy=false; state.ob.step=3; render();
  }catch(e){
    state.ob.busy=false; state.ob.err=e.message||'ошибка'; render();
  }
}
function obFinish(){
  const ids=Object.keys(state.ob.selected).map(Number);
  if(state.ob.mode==='add'){
    ids.forEach((id,idx)=>{
      const c=state.ob.courses.find(x=>x.id===id);
      if(!c || state.subjects.some(s=>s.courseId===id)) return;
      const ls=(state.ob.fetched.lessons||{})[id]||[];
      state.subjects.push(makeSubject(c,ls,state.subjects.length+idx,state.ob.progress[id]||0));
    });
    state.dayPlan={date:'',items:[]};
    state.ob={...defState().ob};
    state.tab='today'; save(); render();
    toast('Предмет добавлен');
    return;
  }
  state.subjects=[];
  ids.forEach((id,idx)=>{
    const c=state.ob.courses.find(x=>x.id===id);
    const ls=(state.ob.fetched.lessons||{})[id]||[];
    if(c && ls.length) state.subjects.push(makeSubject(c,ls,idx,state.ob.progress[id]||0));
  });
  state.onboarded=true;
  state.ob={...defState().ob};
  state.tab='today';
  state.dayPlan={date:'',items:[]};
  state.dataTs=Date.now();
  state.dataAt=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  state.lastError='';
  save(); render();
}

/* ======================= синхронизация ======================= */
async function sync(silent){
  if(!state.token){ if(!silent) toast('Сначала подключи аккаунт'); return; }
  try{
    const schedule=await getSchedule(state.token);
    const dm=dateMapFrom(schedule);
    for(const s of state.subjects){
      const raw=await getLessons(state.token,s.courseId);
      const ls=buildLessons(raw,dm);
      if(ls.length) s.lessons=ls;
    }
    if(state.subjects.some(s=>!s.cover)){
      try{
        const courses=await getAllCourses(state.token);
        for(const s of state.subjects){
          const c=courses.find(x=>x.id===s.courseId);
          if(c) s.cover=c.cover||'';
        }
      }catch(e){}
    }
    state.dataAt=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
    state.dataTs=Date.now(); state.lastError='';
    save();
    if(!(silent && document.activeElement && document.activeElement.tagName==='INPUT')) render();
    if(!silent) toast('Обновлено');
  }catch(e){
    state.lastError=e.message||'ошибка'; save();
    if(!silent) toast('Не получилось: '+e.message);
    else render();
  }
}

/* ======================= календарь ======================= */
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function fold(line){
  const enc=new TextEncoder();
  if(enc.encode(line).length<=73) return line;
  let out='',cur='';
  for(const ch of line){
    if(enc.encode(cur+ch).length>73){ out+=cur+'\r\n '; cur=ch; }
    else cur+=ch;
  }
  return out+cur;
}
function stamp(d,h,m){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(h)+pad(m)+'00'; }
function icsText(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//dogonyalka//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Догонялка'];
  const [hh,mm]=state.settings.time.split(':').map(Number);
  const start=new Date(); start.setHours(hh,mm,0,0);
  if(start<new Date()) start.setDate(start.getDate()+1);
  const dts=new Date().toISOString().replace(/[-:]/g,'').replace(/\..*/,'Z');
  L.push('BEGIN:VEVENT','UID:dogonyalka-daily-'+Date.now()+'@local','DTSTAMP:'+dts,'DTSTART:'+stamp(start,hh,mm),
    'DURATION:PT15M','RRULE:FREQ=DAILY;COUNT=120','SUMMARY:Догонялка: план на сегодня','DESCRIPTION:'+icsEsc(dailyText()),
    'URL:'+SITE,'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT0M','DESCRIPTION:Посмотри, что нужно догнать','END:VALARM','END:VEVENT');
  const days=Math.max(1,state.settings.days);
  const queues=state.subjects.map(s=>({ s, items: remainingOf(s).slice(0,days*15) }));
  for(let d=1; d<=days; d++){
    const date=new Date(); date.setDate(date.getDate()+d); date.setHours(hh,mm,0,0);
    for(const q of queues){
      const chunk=q.items.splice(0,perDayOf(q.s));
      if(!chunk.length) continue;
      L.push('BEGIN:VEVENT','UID:dogonyalka-'+q.s.id+'-'+d+'-'+Date.now()+'@local','DTSTAMP:'+dts,
        'DTSTART:'+stamp(date,hh,mm),'DURATION:PT45M',
        'SUMMARY:'+icsEsc(q.s.name+': уроки '+chunk.map(x=>x.N).join(', ')),
        'DESCRIPTION:'+icsEsc(chunk.map(x=>'Урок '+x.N+'. '+x.T).join('\n')),
        'URL:'+SITE,'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT10M','DESCRIPTION:'+icsEsc(q.s.name+': урок '+chunk[0].N),'END:VALARM','END:VEVENT');
    }
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n');
}
function dailyText(){
  if(!state.subjects.length) return 'Открой приложение и посмотри план.';
  return state.subjects.map(s=>{
    const r=remainingOf(s);
    return r.length ? s.name+': '+r.length+' до урока '+targetNo(s)+', начни с '+r[0].N+'.' : s.name+': всё просмотрено.';
  }).join(' ')+' План: '+SITE;
}
function downloadICS(){
  const blob=new Blob(['\ufeff'+icsText()],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='napominaniya.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast('Файл скачан — открой его, телефон добавит события');
}

/* ======================= уведомления ======================= */
async function notifyTick(){
  if(!state.settings.notify) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const t=todayKey();
  if(state.settings.lastNotified===t) return;
  if(nowHM()<state.settings.time) return;
  const body=state.subjects.map(s=>{
    const r=remainingOf(s);
    return r.length?s.name+': '+r.length+' до урока '+targetNo(s):s.name+': догнал';
  }).join(' · ');
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification) await reg.showNotification('Догонялка: план на сегодня',{body,tag:'daily'});
    else new Notification('Догонялка: план на сегодня',{body,tag:'daily'});
    state.settings.lastNotified=t; save();
  }catch(e){}
}

/* ======================= события ======================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600);
}
function setCurrent(s,n){
  n=Math.max(0,Math.min(999,n|0));
  s.watched=n?range(1,n):[];
}
function toggleWatched(s,n){
  const w=new Set(s.watched||[]);
  if(w.has(n)) w.delete(n); else w.add(n);
  s.watched=[...w].sort((a,b)=>a-b);
  state._just=s.id+':'+n;
}

let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; });
window.addEventListener('appinstalled',()=>{ installPrompt=null; toast('Установлено на главный экран'); });
function installApp(){
  if(installPrompt){
    installPrompt.prompt();
    Promise.resolve(installPrompt.userChoice).then(()=>{ installPrompt=null; }).catch(()=>{});
    return;
  }
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)) toast('Safari: «Поделиться» → «На экран „Домой“»');
  else toast('Chrome: меню ⋮ → «Установить приложение»');
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  const a=el.dataset.act;

  if(a==='tab'){
    const order=['today','plan','set'];
    const from=order.indexOf(state.tab), to=order.indexOf(el.dataset.tab);
    state._anim = to>from ? 'slide-l' : to<from ? 'slide-r' : '';
    state.tab=el.dataset.tab; buzz(6); save(); render(); window.scrollTo(0,0); return;
  }
  if(a==='plansubj'){ state.planSubj=el.dataset.subj; save(); render(); return; }
  if(a==='openplan'){ state.planSubj=el.dataset.subj; state.tab='plan'; save(); render(); window.scrollTo(0,0); return; }
  if(a==='toggle'){
    const s=subjBy(el.dataset.subj); if(!s) return;
    toggleWatched(s,+el.dataset.n);
    buzz(10);
    let done=false;
    if(planDone() && state.celebrated!==todayKey()){
      state.celebrated=todayKey(); done=true;
    }
    save(); render();
    if(done){ celebrate(); buzz([14,50,14,50,26]); toast('План дня закрыт — красота'); }
    return;
  }
  if(a==='extend'){ extendPlan(); state.celebrated=''; save(); render(); return; }
  if(a==='markall'){ const s=subjBy(el.dataset.subj); if(s){ setCurrent(s,+el.dataset.n); buzz(18); save(); render(); } return; }
  if(a==='accent'){ state.settings.accent=el.dataset.k; buzz(8); save(); render(); return; }
  if(a==='ics'){ downloadICS(); return; }
  if(a==='sync'){ sync(false); return; }
  if(a==='install'){ installApp(); return; }
  if(a==='reload'){
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.update().catch(()=>{})));
      }
    }catch(e){}
    location.replace(location.pathname+'?r='+Date.now());
    return;
  }

  if(a==='days'){
    state.settings.days=Math.max(1,Math.min(180,(state.settings.days||7)+Number(el.dataset.d)));
    state.dayPlan={date:'',items:[]}; state.celebrated=''; save(); render(); return;
  }
  if(a==='savetoken'){
    const inp=document.querySelector('[data-act="token"]');
    state.token=(inp?inp.value:'').trim(); save(); sync(false); return;
  }
  if(a==='addsubj'){
    state.ob={...defState().ob, active:true, mode:'add', step:2, courses:[], selected:{}, busy:true};
    render();
    try{
      const courses=await getAllCourses(state.token);
      state.ob.courses=courses; state.ob.busy=false;
    }catch(e){ state.ob.busy=false; state.ob.err=e.message; }
    save(); render(); return;
  }
  if(a==='delsubj'){
    const s=subjBy(el.dataset.subj);
    if(s && confirm('Убрать «'+s.name+'»?')){
      state.subjects=state.subjects.filter(x=>x.id!==s.id);
      state.dayPlan={date:'',items:[]}; save(); render();
    }
    return;
  }
  if(a==='resetprogress'){
    if(confirm('Отметить все уроки непросмотренными?')){
      state.subjects.forEach(s=>s.watched=[]); state.dayPlan={date:'',items:[]}; save(); render();
    }
    return;
  }
  if(a==='resetsetup'){
    if(confirm('Сбросить настройки и выбрать курсы заново?')){
      state=defState(); state.ob.active=true; state.ob.step=1;
      save(); render();
    }
    return;
  }

  /* онбординг */
  if(a==='ob-start'){ state.ob.step=1; save(); render(); return; }
  if(a==='ob-back'){ state.ob.step=Math.max(0,state.ob.step-1); state.ob.err=''; save(); render(); return; }
  if(a==='ob-connect'){ obConnect(); return; }
  if(a==='ob-sel'){
    const id=+el.dataset.id;
    if(state.ob.selected[id]) delete state.ob.selected[id]; else state.ob.selected[id]=true;
    save(); render(); return;
  }
  if(a==='ob-next'){
    if(state.ob.step===2){ await obLoadLessons(); return; }
    if(state.ob.step===3){ state.ob.step=4; save(); render(); return; }
    if(state.ob.step===4){ state.ob.step=5; save(); render(); return; }
    return;
  }
  if(a==='ob-cur'){
    const id=+el.dataset.id;
    const cur=state.ob.progress[id]||0;
    state.ob.progress[id]=Math.max(0,Math.min(999,cur+Number(el.dataset.d)));
    save(); render(); return;
  }
  if(a==='ob-take'){
    state.ob.progress[+el.dataset.id]=+el.dataset.n;
    save(); render(); return;
  }
  if(a==='setcur'){
    const s=subjBy(el.dataset.subj);
    if(s){ setCurrent(s,currentNo(s)+Number(el.dataset.d)); state.dayPlan={date:'',items:[]}; save(); render(); }
    return;
  }
  if(a==='ob-finish'){ obFinish(); return; }
});

document.addEventListener('input',e=>{
  if(e.target.id==='cq'){
    state.ob.q=e.target.value;
    const pos=e.target.selectionStart;
    render();
    const el=document.getElementById('cq');
    if(el){ el.focus(); el.setSelectionRange(pos,pos); }
  }
});

document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const a=el.dataset.act;
  if(a==='settime'){ state.settings.time=el.value||'19:00'; state.settings.lastNotified=''; save(); render(); }
  else if(a==='token'){ /* сохраняется кнопкой */ }
  else if(a==='ob-all'){ state.ob.showAll=el.checked; save(); render(); }
  else if(a==='ob-curinput'){ state.ob.progress[+el.dataset.id]=Math.max(0,Math.min(999,+el.value||0)); save(); render(); }
  else if(a==='notify'){
    if(el.checked){
      if(!('Notification' in window)){ toast('Браузер не умеет уведомления'); el.checked=false; return; }
      const p=await Notification.requestPermission();
      if(p!=='granted'){ toast('Разрешение не выдано — используй календарь (.ics)'); el.checked=false; state.settings.notify=false; save(); render(); return; }
      state.settings.notify=true; save();
    } else { state.settings.notify=false; save(); }
  }
});

/* ======================= старт ======================= */
save();
render();
notifyTick();
if(state.token && state.onboarded) sync(true);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && state.token && Date.now()-state.dataTs>30*60*1000) sync(true);
});
setInterval(()=>{
  notifyTick();
  if(state.token && Date.now()-state.dataTs>3*3600*1000) sync(true);
},60000);

if('serviceWorker' in navigator && (location.protocol==='https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(()=>{});
}
</script>
